name: Build APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip and Move Files
      run: |
        unzip PayVault.zip -d temp_unzip
        SUBDIR=$(find temp_unzip -mindepth 1 -maxdepth 1 -type d | head -n 1)
        if [ ! -z "$SUBDIR" ]; then
          mv $SUBDIR/* .
          mv $SUBDIR/.* . 2>/dev/null || true
        else
          mv temp_unzip/* .
        fi
        rm -rf temp_unzip
        ls -la
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.4"
    - name: Build APK
      run: gradle assembleDebug --stacktrace
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PayVault-APK
        path: app/build/outputs/apk/debug/app-debug.apk
